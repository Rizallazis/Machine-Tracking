services:
  - type: web
    name: machine-tracking-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build --workspace=@machine-tracking/shared && npm run build --workspace=@machine-tracking/api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: STORAGE_MODE
        value: google
      - key: FRONTEND_URL
        sync: false
